[project]
name = "otomasi-kit"
version = "0.1.0"
description = "Kumpulan otomasi: data & dokumen, konten AI, scraper web, dan tools developer"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib -q"
testpaths = ["data_tools", "konten", "scraper", "devtools"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]
