# CI: lint (ruff) + tes (pytest) di Python 3.11 dan 3.13 untuk setiap push/PR ke main.
# Tidak butuh secret apa pun: tes modul konten memalsukan (mock) API Anthropic.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . --output-format github

      - name: Tes (pytest)
        env:
          # Pastikan tidak ada panggilan API sungguhan selama tes.
          ANTHROPIC_API_KEY: ""
        run: pytest
