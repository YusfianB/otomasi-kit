# Monitor scraper terjadwal (harian) + bisa dijalankan manual dengan config lain.
#
# Runner GitHub-hosted punya akses internet, jadi situs sungguhan bisa di-scrape di sini
# (berbeda dengan sandbox lokal yang mungkin memblokir internet).
# Riwayat (SQLite) disimpan antar-run dengan actions/cache agar perubahan bisa dideteksi.
# Laporan perubahan diunggah sebagai artifact.
name: Jadwal Scraper Monitor

on:
  schedule:
    # Setiap hari 22:43 UTC = 05:43 WIB.
    - cron: "43 22 * * *"
  workflow_dispatch:
    inputs:
      config:
        description: "File config scraper (YAML)"
        required: true
        default: scraper/contoh/produk_toko.yaml

permissions:
  contents: read

concurrency:
  group: scraper-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONFIG: ${{ inputs.config || 'scraper/contoh/produk_toko.yaml' }}
      RIWAYAT: output/riwayat_scraper.sqlite
      LAPORAN: output/laporan/perubahan.md
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependency
        run: pip install -r requirements.txt

      - name: Pulihkan riwayat run sebelumnya
        uses: actions/cache@v6
        with:
          path: ${{ env.RIWAYAT }}
          # Key unik per run; restore-keys mengambil riwayat terbaru untuk config yang sama.
          key: scraper-riwayat-${{ hashFiles(env.CONFIG) }}-${{ github.run_id }}
          restore-keys: |
            scraper-riwayat-${{ hashFiles(env.CONFIG) }}-

      - name: Jalankan monitor
        # Sesuaikan bila opsi CLI scraper berubah (lihat: python -m scraper monitor --help).
        # Tambahkan --gagal-jika-berubah bila ingin run "gagal" (dan memicu notifikasi email
        # GitHub) setiap kali ada perubahan.
        run: |
          mkdir -p "$(dirname "$LAPORAN")"
          python -m scraper monitor "$CONFIG" \
            --riwayat "$RIWAYAT" \
            --laporan "$LAPORAN" \
            --simpan-run 30

      - name: Ringkasan
        if: always()
        run: |
          echo "## Laporan perubahan scraper (\`$CONFIG\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$LAPORAN" ]; then
            head -n 200 "$LAPORAN" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Laporan tidak ditemukan." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: laporan-scraper-${{ github.run_number }}
          path: output/laporan/
          if-no-files-found: warn
          retention-days: 30
