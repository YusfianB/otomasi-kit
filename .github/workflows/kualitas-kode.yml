# Cek kualitas kode mingguan (murah): audit kerentanan dependency (pip-audit) + ruff.
# Hasil ditulis ke Job Summary. Run gagal bila ditemukan kerentanan atau error lint.
name: Kualitas Kode

on:
  schedule:
    # Setiap Rabu 01:11 UTC = 08:11 WIB.
    - cron: "11 1 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependency + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pip-audit

      - name: Audit kerentanan dependency (pip-audit)
        id: audit
        continue-on-error: true
        # Mengaudit environment yang baru di-install (requirements-dev.txt + turunannya).
        run: |
          pip-audit --desc on --format markdown --output audit.md

      - name: Lint (ruff)
        id: ruff
        continue-on-error: true
        run: |
          ruff check . --output-format concise > ruff.txt 2>&1

      - name: Tulis Job Summary
        if: always()
        run: |
          {
            echo "## Audit dependency (pip-audit): ${{ steps.audit.outcome }}"
            if [ -s audit.md ]; then cat audit.md; else echo "Tidak ada kerentanan yang diketahui."; fi
            echo
            echo "## Ruff: ${{ steps.ruff.outcome }}"
            echo '```'
            head -n 300 ruff.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gagal bila ada temuan
        if: steps.audit.outcome == 'failure' || steps.ruff.outcome == 'failure'
        run: |
          echo "pip-audit: ${{ steps.audit.outcome }}, ruff: ${{ steps.ruff.outcome }}"
          exit 1
