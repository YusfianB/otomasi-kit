judul: Bot Telegram
deskripsi: Bot Telegram long-polling (requests) dengan /start, /help, FAQ dari YAML, dan pengingat
deskripsi_default: Bot Telegram {judul}
langkah:
  - cd {folder}
  - python -m venv .venv && source .venv/bin/activate   (Windows - .venv\Scripts\activate)
  - pip install -r requirements-dev.txt
  - cp .env.example .env   lalu isi TELEGRAM_BOT_TOKEN dari @BotFather
  - pytest
  - python -m bot
